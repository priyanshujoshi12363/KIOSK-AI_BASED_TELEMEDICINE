<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
    <title>Aarogya Video Consult</title>
    <style>
      * { margin: 0; box-sizing: border-box; }
      html, body { height: 100%; background: #15171f; overflow: hidden; font-family: sans-serif; }
      #remote { position: absolute; inset: 0; width: 100%; height: 100%; background: #15171f; }
      #local { position: absolute; top: 16px; right: 16px; width: 110px; height: 150px; border-radius: 12px; border: 2px solid #fff; background: #000; overflow: hidden; z-index: 5; }
      #status { position: absolute; top: 16px; left: 16px; color: #fff; background: rgba(0,0,0,.45); padding: 6px 12px; border-radius: 8px; font-size: 13px; z-index: 6; }
      .bar { position: absolute; top: 0; left: 0; right: 0; height: 5px; display: flex; z-index: 7; }
      .bar > div { flex: 1; } .s { background: #ff9933; } .w { background: #fff; } .g { background: #138808; }
    </style>
  </head>
  <body>
    <div class="bar"><div class="s"></div><div class="w"></div><div class="g"></div></div>
    <div id="remote"></div>
    <div id="local"></div>
    <div id="status">Connecting…</div>

    <script src="https://download.agora.io/sdk/release/AgoraRTC_N-4.20.2.js"></script>
    <script src="/socket.io/socket.io.js"></script>
    <script>
      const params = new URLSearchParams(location.search);
      const sessionId = params.get("session");
      const role = params.get("role") || "peer";
      const statusEl = document.getElementById("status");
      const remoteEl = document.getElementById("remote");
      const localEl = document.getElementById("local");

      const uid = role === "doctor" ? 2 : 1;

      function setStatus(text) {
        statusEl.textContent = text;
      }

      function channelName() {
        return String(sessionId || "lobby").replace(/[^a-zA-Z0-9!#$%&()+\-:;<=>.?@\[\]^_{|}~,]/g, "").slice(0, 64);
      }

      async function fetchToken(channel) {
        const res = await fetch(`/api/rtc/agora/token?channel=${encodeURIComponent(channel)}&uid=${uid}`);
        if (!res.ok) throw new Error("token_failed");
        return res.json();
      }

      async function startAgora() {
        const channel = channelName();
        const cfg = await fetchToken(channel);

        const client = AgoraRTC.createClient({ mode: "rtc", codec: "vp8" });

        client.on("user-published", async (user, mediaType) => {
          await client.subscribe(user, mediaType);
          if (mediaType === "video") {
            user.videoTrack.play(remoteEl, { fit: "cover" });
            setStatus("Connected");
          }
          if (mediaType === "audio") {
            user.audioTrack.play();
          }
        });

        client.on("user-unpublished", () => setStatus("The other person left"));
        client.on("user-left", () => setStatus("The other person left"));
        client.on("connection-state-change", (state) => {
          if (state === "RECONNECTING") setStatus("Reconnecting…");
          if (state === "DISCONNECTED") setStatus("Call ended");
        });

        await client.join(cfg.appId, channel, cfg.token || null, uid);
        setStatus("Waiting for the other person…");

        let tracks = [];
        try {
          tracks = await AgoraRTC.createMicrophoneAndCameraTracks();
          tracks[1].play(localEl, { fit: "cover" });
          await client.publish(tracks);
        } catch (err) {
          setStatus("Camera/mic blocked");
        }

        window.addEventListener("beforeunload", () => {
          tracks.forEach((t) => {
            try { t.stop(); t.close(); } catch (e) {}
          });
          client.leave();
        });
      }

      const socket = io();
      socket.emit("join", { sessionId, role });

      startAgora().catch((err) => {
        console.error(err);
        setStatus("Could not start the call");
      });
    </script>
  </body>
</html>
